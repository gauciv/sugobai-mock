<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" />
    <meta name="description" content="A live mobile preview of the SugoBai app." />
    <title>SugoBai — Mobile Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <header class="preview-header">
        <a class="brand" href="#" aria-label="SugoBai preview home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>sugobai<span class="brand-dot">.</span></span>
        </a>
      </header>

      <section class="preview-content" aria-label="Mobile app preview">
        <div class="phone-wrap">
          <div class="phone">
            <div class="phone-button button-right"></div>
            <div class="phone-button button-left-one"></div>
            <div class="phone-button button-left-two"></div>
            <div class="phone-bezel">
              <div class="screen">
                <div class="status-bar">
                  <span class="status-time" id="status-time">9:41</span>
                  <div class="island" aria-hidden="true"></div>
                  <div class="status-icons" aria-hidden="true">
                    <svg viewBox="0 0 18 14"><path d="M1 5.2C5.5 1.2 12.5 1.2 17 5.2M4 8.2c2.8-2.4 7.2-2.4 10 0m-7 3c1.1-.9 2.9-.9 4 0"/><circle cx="9" cy="12.2" r=".8" fill="currentColor" stroke="none"/></svg>
                    <svg viewBox="0 0 20 14"><rect x="1" y="2" width="15" height="10" rx="2"/><path d="M18 5v4"/><rect class="battery-fill" x="3" y="4" width="10.5" height="6" rx="1"/></svg>
                  </div>
                </div>

                <div class="app-scroll" id="app-scroll">
                  <div class="app-topline">
                    <div class="location">
                      <span class="eyebrow">YOUR LOCATION</span>
                      <button class="location-button" type="button" aria-label="Change location">
                        <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M14.2 7.5c0 3.8-5.2 8.3-5.2 8.3S3.8 11.3 3.8 7.5a5.2 5.2 0 1 1 10.4 0Z"/><circle cx="9" cy="7.4" r="1.8"/></svg>
                        <span>Cebu City</span><svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
                      </button>
                    </div>
                    <button class="avatar-button" type="button" aria-label="Open profile">M</button>
                  </div>

                  <section class="greeting">
                    <p>Hey, Mika <span class="wave" aria-hidden="true">✳</span></p>
                    <h1>What can we<br />help you <em>get done?</em></h1>
                  </section>

                  <button class="search-card" type="button" id="search-button">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.8"/><path d="m13.2 13.2 4 4"/></svg>
                    <span>What do you need today?</span>
                    <span class="search-arrow" aria-hidden="true">↗</span>
                  </button>

                  <section class="services-section">
                    <div class="section-heading"><h2>Pick a service</h2><button class="text-link" type="button" id="all-services">See all <span>→</span></button></div>
                    <div class="service-grid">
                      <button class="service-card service-orange" data-service="Food & groceries" type="button">
                        <span class="service-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7.5 13h17l-1.4 13H8.9L7.5 13Z"/><path d="M12 13V9.5a4 4 0 0 1 8 0V13M12 18c.3 2.2 1.4 3.5 3.8 3.7"/></svg></span>
                        <span class="service-name">Food &<br />groceries</span><span class="service-arrow">↗</span>
                      </button>
                      <button class="service-card service-blue" data-service="Parcel delivery" type="button">
                        <span class="service-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 4.5 11 6.1v11L16 28l-11-6.4v-11L16 4.5Z"/><path d="m5.5 10.8 10.5 6 10.5-6M16 17v11M10.5 7.5l11 6.2v4.1"/></svg></span>
                        <span class="service-name">Parcel<br />delivery</span><span class="service-arrow">↗</span>
                      </button>
                      <button class="service-card service-lilac" data-service="Ride" type="button">
                        <span class="service-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m7 17 2.4-7.2A3 3 0 0 1 12.2 8h7.6a3 3 0 0 1 2.8 1.8L25 17v8h-3v-2H10v2H7v-8Z"/><path d="M8 17h17M11 20h.1M21 20h.1M11 8l1.5-3h7L21 8"/></svg></span>
                        <span class="service-name">Book a<br />ride</span><span class="service-arrow">↗</span>
                      </button>
                      <button class="service-card service-green" data-service="Anything else" type="button">
                        <span class="service-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5v22M5 16h22M8.2 8.2l15.6 15.6m0-15.6L8.2 23.8"/><circle cx="16" cy="16" r="10.5"/></svg></span>
                        <span class="service-name">Anything<br />else</span><span class="service-arrow">↗</span>
                      </button>
                    </div>
                  </section>

                  <section class="promo-card">
                    <div class="promo-copy"><span class="promo-label">YOUR FIRST SUGO</span><h2>Little task.<br />Big <em>relief.</em></h2><button type="button" class="promo-cta" id="promo-button">Get ₱50 off <span>→</span></button></div>
                    <div class="promo-art" aria-hidden="true"><div class="sun"></div><div class="bag"><span></span></div><div class="spark spark-a">✳</div><div class="spark spark-b">✦</div><div class="orbit"></div></div>
                  </section>

                  <section class="recent-section">
                    <div class="section-heading"><h2>Recent activity</h2><button class="text-link" type="button" id="activity-link">View all <span>→</span></button></div>
                    <div class="empty-activity"><span class="activity-icon">✦</span><span>Your next errand starts here.</span></div>
                  </section>
                </div>

                <nav class="tab-bar" aria-label="App navigation">
                  <button class="tab active" data-tab="Home" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="m3 9 8-6 8 6v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9Z"/></svg><span>Home</span></button>
                  <button class="tab" data-tab="Activity" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M4 5.5h14M4 11h14M4 16.5h8"/><circle cx="17" cy="16.5" r="2.5"/></svg><span>Activity</span></button>
                  <button class="tab" data-tab="Inbox" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M4 5h14a1 1 0 0 1 1 1v11H3V6a1 1 0 0 1 1-1Z"/><path d="m3 14 4.5-.1 1.4 2h3.2l1.4-2 4.5.1"/></svg><span>Inbox</span></button>
                  <button class="tab" data-tab="Account" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="7.5" r="3.5"/><path d="M4.5 19a6.5 6.5 0 0 1 13 0"/></svg><span>Account</span></button>
                </nav>
                <div class="home-indicator" aria-hidden="true"><span></span></div>
                <div class="toast" id="toast" role="status" aria-live="polite"></div>
              </div>
            </div>
          </div>
        </div>

      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
