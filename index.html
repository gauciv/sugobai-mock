<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" />
    <meta name="description" content="A live mobile preview of the SugoBai app." />
    <title>SugoBai — Mobile Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <header class="preview-header">
        <a class="brand" href="#" aria-label="SugoBai preview home">
          <img class="brand-logo" src="assets/sugobai-logo.png" alt="" />
          <span>SugoBai<span class="brand-dot">.</span></span>
        </a>
      </header>

      <section class="preview-content" aria-label="Mobile app preview">
        <div class="phone-wrap">
          <div class="phone">
            <div class="phone-button button-right"></div>
            <div class="phone-button button-left-one"></div>
            <div class="phone-button button-left-two"></div>
            <div class="phone-bezel">
              <div class="screen">
                <div class="status-bar">
                  <span class="status-time" id="status-time">9:41</span>
                  <div class="island" aria-hidden="true"></div>
                  <div class="status-icons" aria-hidden="true">
                    <svg viewBox="0 0 18 14"><path d="M1 5.2C5.5 1.2 12.5 1.2 17 5.2M4 8.2c2.8-2.4 7.2-2.4 10 0m-7 3c1.1-.9 2.9-.9 4 0"/><circle cx="9" cy="12.2" r=".8" fill="currentColor" stroke="none"/></svg>
                    <svg viewBox="0 0 20 14"><rect x="1" y="2" width="15" height="10" rx="2"/><path d="M18 5v4"/><rect class="battery-fill" x="3" y="4" width="10.5" height="6" rx="1"/></svg>
                  </div>
                </div>

                <div class="app-scroll" id="app-scroll">
                  <div class="app-topline">
                    <div class="location">
                      <span class="eyebrow">YOUR LOCATION</span>
                      <button class="location-button" type="button" aria-label="Change location">
                        <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M14.2 7.5c0 3.8-5.2 8.3-5.2 8.3S3.8 11.3 3.8 7.5a5.2 5.2 0 1 1 10.4 0Z"/><circle cx="9" cy="7.4" r="1.8"/></svg>
                      <span>Cebu City</span><svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
                      </button>
                    </div>
                    <button class="avatar-button" type="button" aria-label="Open profile">M</button>
                  </div>

                  <section class="greeting">
                    <p>Good morning, Mika <span class="wave" aria-hidden="true">✳</span></p>
                    <h1>Find the right<br />person for the <em>job.</em></h1>
                  </section>

                  <div class="search-row">
                    <button class="search-card" type="button" id="search-button">
                      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.8"/><path d="m13.2 13.2 4 4"/></svg>
                      <span>What needs fixing at home?</span>
                    </button>
                    <button class="filter-button" id="filter-button" type="button" aria-label="Filter professionals"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M6 10h8m-5 5h2"/><circle cx="7" cy="5" r="1.5"/><circle cx="12" cy="10" r="1.5"/></svg></button>
                  </div>

                  <section class="home-hero">
                    <div class="hero-copy"><span class="hero-label">LOCAL HELP, MADE SIMPLE</span><h2>Good work.<br /><em>Good people.</em></h2><button id="post-job" type="button">Post a job <span>→</span></button></div>
                    <div class="hero-art" aria-hidden="true"><span class="hero-orbit"></span><img src="assets/sugobai-logo.png" alt="" /></div>
                    <span class="hero-spark hero-spark-one" aria-hidden="true">✦</span><span class="hero-spark hero-spark-two" aria-hidden="true">✳</span>
                  </section>

                  <section class="services-section">
                    <div class="section-heading"><h2>Popular services</h2><button class="text-link" type="button" id="all-services">See all <span>→</span></button></div>
                    <div class="service-grid">
                      <button class="service-card service-orange" data-service="Electrical work" type="button">
                        <span class="service-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m18 4-10 14h7l-1 10 10-14h-7l1-10Z"/></svg></span>
                        <span class="service-name">Electric</span>
                      </button>
                      <button class="service-card service-blue" data-service="Plumbing" type="button">
                        <span class="service-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 5v8a6 6 0 0 0 12 0V9M7 5h6M19 9h6M16 19v4a4 4 0 1 0 8 0v-2"/><path d="M23 18v3"/></svg></span>
                        <span class="service-name">Plumbing</span>
                      </button>
                      <button class="service-card service-lilac" data-service="Cleaning" type="button">
                        <span class="service-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m12 7 12 12M9 10l5-5 5 5-5 5M19 19l7 7M6 26l11-11 5 5L11 31H6v-5Z"/><path d="m23 7 1-3m3 7 3-1"/></svg></span>
                        <span class="service-name">Cleaning</span>
                      </button>
                      <button class="service-card service-green" data-service="Carpentry" type="button">
                        <span class="service-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m5 15 11-9 11 9M8 13v13h16V13M13 26v-8h6v8"/><path d="m22 6 4 3"/></svg></span>
                        <span class="service-name">Carpentry</span>
                      </button>
                    </div>
                  </section>

                  <section class="pros-section">
                    <div class="section-heading"><h2>Popular near you</h2><button class="text-link" type="button" id="activity-link">View all <span>→</span></button></div>
                    <button class="worker-card" type="button" id="worker-button">
                      <span class="worker-avatar" aria-hidden="true"><span>JR</span><i>✓</i></span>
                      <span class="worker-info"><span class="worker-name">Jun Reyes <span class="verified-mark">✓</span><span class="trade-chip">Electrician</span></span><span class="worker-trade">Cebu City · Available today</span><span class="worker-proof"><span class="rating-star">★</span> 4.9 <span class="proof-divider">·</span> 38 reviews <span class="proof-divider">·</span> Verified</span></span>
                      <span class="worker-price">₱350<small> / visit</small></span>
                      <span class="portfolio-strip" aria-label="Examples from Jun’s past work"><span class="portfolio-work work-a"></span><span class="portfolio-work work-b"></span><span class="portfolio-work work-c"></span><span class="portfolio-caption">Recent work <b>See portfolio →</b></span></span>
                      <span class="worker-book">View profile <span>→</span></span>
                    </button>
                  </section>
                  <button class="worker-invite" id="worker-invite" type="button"><span>Skilled worker?</span> Find local jobs <b>→</b></button>
                </div>

                <nav class="tab-bar" aria-label="App navigation">
                  <button class="tab active" data-tab="Home" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="m3 9 8-6 8 6v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9Z"/></svg><span>Home</span></button>
                  <button class="tab" data-tab="Jobs" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M4 5.5h14M4 11h14M4 16.5h8"/><circle cx="17" cy="16.5" r="2.5"/></svg><span>Jobs</span></button>
                  <button class="tab" data-tab="Inbox" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M4 5h14a1 1 0 0 1 1 1v11H3V6a1 1 0 0 1 1-1Z"/><path d="m3 14 4.5-.1 1.4 2h3.2l1.4-2 4.5.1"/></svg><span>Inbox</span></button>
                  <button class="tab" data-tab="Profile" type="button"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="7.5" r="3.5"/><path d="M4.5 19a6.5 6.5 0 0 1 13 0"/></svg><span>Profile</span></button>
                </nav>
                <div class="home-indicator" aria-hidden="true"><span></span></div>
                <div class="toast" id="toast" role="status" aria-live="polite"></div>
              </div>
            </div>
          </div>
        </div>

      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
