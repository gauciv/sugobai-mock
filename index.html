<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f2ef" />
    <meta name="description" content="SugoBai connects homeowners in Cebu with verified local workers." />
    <title>SugoBai</title>
    <link rel="icon" href="assets/sugobai-mark-96.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/frame.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/screens.css" />
  </head>
  <body>
    <div class="stage">
      <div class="stage-brand" aria-hidden="true">
        <img src="assets/sugobai-mark-96.webp" alt="" width="40" height="40" />
        <span>SugoBai</span>
      </div>

      <!-- Device wrapper: renders as a phone frame on desktop, and as a plain full-screen container elsewhere. -->
      <div class="device">
        <div class="device-screen">
          <div class="device-status" aria-hidden="true">
            <span class="device-time" id="device-time">9:41</span>
            <span class="device-island"></span>
            <svg class="device-icons" viewBox="0 0 46 12"><path d="M1 8.5h2v3H1zM5 6.5h2v5H5zM9 4h2v7.5H9zM13 1.5h2v10h-2z" fill="currentColor"/><path d="M20.5 4.2a7 7 0 0 1 9 0M22.4 6.4a4 4 0 0 1 5.2 0M24 8.6a1.4 1.4 0 0 1 2 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><rect x="33.5" y="1.5" width="10.5" height="9" rx="2.4" fill="none" stroke="currentColor" opacity=".45"/><rect x="35" y="3" width="7.5" height="6" rx="1.2" fill="currentColor"/><path d="M45.2 4.6v2.8" stroke="currentColor" stroke-linecap="round" opacity=".45"/></svg>
          </div>

          <div class="app" id="app">
            <main class="app-scroll" id="app-scroll"></main>
            <nav class="tabbar" id="tabbar" aria-label="Main">
              <button class="tab" type="button" data-tab="Home"><svg class="icon" aria-hidden="true"><use href="#i-house"/></svg><span>Home</span></button>
              <button class="tab" type="button" data-tab="Jobs"><svg class="icon" aria-hidden="true"><use href="#i-briefcase"/></svg><span>Jobs</span></button>
              <button class="tab" type="button" data-tab="Inbox"><svg class="icon" aria-hidden="true"><use href="#i-chat-circle"/></svg><span>Inbox</span></button>
              <button class="tab" type="button" data-tab="Profile"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></button>
            </nav>
            <div id="sheet-root"></div>
            <div class="toast" id="toast" role="status" aria-live="polite"></div>
          </div>

          <span class="device-home" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/screens.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
